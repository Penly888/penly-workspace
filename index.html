const MODULES = [{"id": 0, "icon": "📋", "name": "总纲规范", "folder": ".", "files": [{"path": "PENLY工作台_总纲规范.md", "name": "PENLY工作台_总纲规范.md", "content": "# 🥑 PENLY工作台 · 总纲规范\n\n> **工作台固定名称**：PENLY工作台（首字母 P 大写）\n> **视觉主色调**：牛油果绿 `#7BA05B`\n> **双重职业身份**：美/加/英/澳/中国香港/新加坡 留学咨询顾问 ｜ 雅思英语博主（雅思A类阅读8分）\n\n---\n\n## 一、六大固定核心模块\n\n| 编号 | 模块名称 | 快捷指令 | 归档文件夹 |\n|:---:|------|:---:|------|\n| 1 | 雅思口语多题串联素材模块 | `/ielts素材` | `雅思口语素材库` |\n| 2 | 每日前沿留学资讯口播脚本模块 | `/留学脚本` | `留学自媒体文案库` |\n| 3 | 院校&专业对比表格模块 | `/院校对比` | `院校申请资料库` |\n| 4 | 英语俚语习语短视频素材模块 | `/英语干货` | `英语干货短视频库` |\n| 5 | 每日《经济学人》外刊精读模块 | `/外刊精读` | `经济学人外刊精读库` |\n| 6 | 每日运程（星盘+八字命理）模块 | `/运势` | `每日星盘运势库` |\n\n---\n\n## 二、永久硬性执行规则\n\n### 规则1 · 雅思口语素材规范\n- 严格对标雅思哥实时更新的考场最新Part2真题题库\n- 生成5-10句精炼、简单地道、易背诵的英文核心句，多题串联\n- 文末标注每句话适配的考题，时态严格统一\n\n### 规则2 · 留学脚本规范\n- 每日产出1篇前沿留学资讯，覆盖美/加/英/澳/港/新六大地区\n- 聚焦新开设专业、签证新政、毕业后工签政策、热门专业发展\n- 产出60秒抖音爆款口播文案，末尾附即梦AI视频画面生成提示词\n\n### 规则3 · 院校对比规范\n- 只输出清晰结构化对比表格，精简无冗余文字\n- 永久取消独立的英文润色专项技能\n\n### 规则4 · 英语短视频素材规范\n- 围绕英语俚语、固定idiom习语展开，搭配生活化例句\n- 产出趣味中文讲解短视频脚本，配套即梦AI绘图/视频提示词\n\n### 规则5 · AEAS永久删除\n- 彻底删除、永久不再提供AEAS 7-9年级相关的所有服务内容\n\n### 规则6 · 外刊精读模块\n- 每日更新最新《经济学人》原版原文，篇幅500-800词\n- 固定输出结构：原版英文全文 → 雅思高频生词注释 → 3处长难句语法拆解 → 中文主旨概括 → 可复用写作地道表达\n\n### 规则7 · 归档规范\n- 所有文档以Markdown格式输出\n- 自动分类归档至6个文件夹\n- 文件命名统一格式：`YYYY-MM-DD_主题`\n\n### 规则8 · 自媒体文案即梦指令\n- 所有自媒体类文案必须附带即梦AI指令，全程杜绝废话\n\n### 规则9 · 每日运程规范（星盘+八字命理）\n- 结合西方占星（太阳天秤/上升天蝎/月亮射手）与周易八字（辛亥日柱·女·壬申年·己酉月·癸巳时）综合推算\n- 固定输出八大结构：① 命盘配置概览 → ② 今日综合运势 → ③ 事业发展运势 → ④ 财运分析 → ⑤ 健康运势 → ⑥ 当日注意事项（十二时辰） → ⑦ 最有可能发生的事情 → ⑧ 今日开运建议\n- 每日8:00自动生成当日运势，归档至每日星盘运势库\n- 用户永久命理信息：\n  - 阳历：1992年10月2日 10:17\n  - 阴历：九月初七（校对用）\n  - 出生地：中国天津\n  - 八字：壬申年 · 己酉月 · 辛亥日 · 癸巳时\n  - 日主：辛金（钗钏金），金水伤官格，喜水木\n  - 星盘：上升天蝎座 · 太阳天秤座 · 月亮射手座\n\n---\n\n## 三、内置快捷唤醒指令\n\n| 唤醒词 | 功能 |\n|:---:|------|\n| `/ielts素材` | 生成雅思口语多题串联素材 |\n| `/留学脚本` | 生成每日前沿留学资讯口播脚本 |\n| `/院校对比` | 生成院校/专业对比表格 |\n| `/英语干货` | 生成英语俚语习语短视频脚本 |\n| `/外刊精读` | 生成当日《经济学人》外刊精读 |\n| `/运势` | 生成当日星盘+八字综合运势 |\n\n---\n\n## 四、自动化定时任务配置\n\n| 执行时间 | 任务内容 | 频 忘的旅行 | 1, 7 |\n| 2 | 描述一个你去过的海边地方 | 1, 2 |\n| 3 | 描述一次旅行中改变计划的经历 | 2 |\n| 4 | 描述一个你想再去一次的地方 | 2 |\n| 5 | 描述一个友好的人 | 3 |\n| 6 | 描述一次遇到陌生人的经历 | 3, 6 |\n| 7 | 描述一个你喜欢的地方 | 4 |\n| 8 | 描述一次悠闲的经历 | 4 |\n| 9 | 描述一次糟糕的天气经历 | 5 |\n| 10 | 描述一次意外事件 | 5, 7 |\n| 11 | 描述一个你尊敬的老人 | 6 |\n| 12 | 描述一次有趣的对话 | 6 |\n| 13 | 描述一次意想不到的好事 | 7 |\n| 14 | 描述一个开心的经历 | 7 |\n| 15 | 描述一次学到道理的经历 | 8 |\n| 16 | 描述一个重要的决定 | 8 |\n\n---\n\n## 背诵提示\n\n- **时态**：全篇统一一般过去时，注意动词过去式（took, had, struck, spent, got, turned, realize）\n- **串联策略**：以\"海边小镇旅行\"为主线，串联人物（老人）、事件（暴雨）、感悟（慢生活）三类考题\n- **加分表达**：spontaneous trip / breathtaking / struck me most / wandering through / got caught in / turned out to be / looking back\n"}, {"path": "雅思口语素材库/2026-07-29_Part2素材.md", "name": "2026-07-29_Part2素材.md", "content": "# 🥑 雅思口语 Part 2 多题串联素材 | 2026-07-29\n\n> **主题色：牛油果绿 #8FBC5A** | 题库：2026年5-8月 雅思哥 Part 2 真题\n\n---\n\n## 📋 今日考题\n\n**Describe a time when you changed an important opinion of yours**\n改变重要想法的经历\n\nYou should say:\n- What the opinion was\n- When you changed it\n- Why you changed it\n- And explain how you felt after changing this opinion\n\n---\n\n## 🎯 10句核心素材（一般过去时 | 简单地道 | 易背诵）\n\n> **背景设定**：我曾经认为只有出国留学才能学好英语，但一次国内英语角的经历改变了我的看法。\n\n### Sentence 1\n> I used to believe that the only way to learn English well was to study abroad.\n\n我以前一直相信学好英语的唯一方法就是出国留学。\n\n### Sentence 2\n> I held this opinion for years because everyone around me said the same thing.\n\n我抱持这个观点很多年，因为身边所有人都这么说。\n\n### Sentence 3\n> But last summer, a friend dragged me to an English corner at a local café.\n\n但去年夏天，一个朋友硬拉着我去了一家本地咖啡馆的英语角。\n\n### Sentence 4\n> I was really skeptical at first and expected it to be a waste of time.\n\n我一开始非常怀疑，觉得这肯定是在浪费时间。\n\n### Sentence 5\n> To my surprise, I met a girl who had never left the country but spoke like a native speaker.\n\n出乎意料的是，我遇到一个从没出过国的女孩，但她英语说得像母语者一样。\n\n### Sentence 6\n> She told me she practiced every single day using podcasts, movies, and online language partners.\n\n她告诉我她每天用播客、电影和在线语伴坚持练习。\n\n### Sentence 7\n> That conversation completely shifted my perspective on language learning.\n\n那次对话彻底改变了我对语言学习的看法。\n\n### Sentence 8\n> I realized that motivation and consistency mattered far more than your location.\n\n我意识到动力和坚持远比你在哪里学习重要得多。\n\n### Sentence 9\n> From that day on, I stopped making excuses and started building my own immersive English environment at home.\n\n从那天起，我不再找借口，开始在家打造自己的沉浸式英语环境。\n\n### Sentence 10\n> Looking back, I felt both foolish for holding such a narrow view and relieved that I finally opened my mind.\n\n回想起来，我既为曾经持有如此狭隘的观点感到愚蠢，又为终于打开思路感到释然。\n\n---\n\n## 🔗 多题串联适配表\n\n| 题号 | 雅思哥 Part 2 真题 | 可复用句子 |\n|------|-------------------|-----------|\n| 1 | Describe a person who encouraged you to achieve a goal | S3, S5, S6 |\n| 2 | Describe a time you made a decision to change something | S7, S8, S9 |\n| 3 | Describe an interesting conversation you had | S5, S6, S7 |\n| 4 | Describe a skill you learned that was difficult | S1, S2, S6, S9 |\n| 5 | Describe a place you visited that changed your view | S3, S7, S8, S10 |\n| 6 | Describe an important lesson you learned | S8, S9, S10 |\n| 7 | Describe a time you felt surprised about something | S5, S7 |\n| 8 | Describe someone who speaks a foreign language well | S5, S6 |\n| 9 | Describe something you did that was a waste of time (you expected to be) | S4, S5, S7 |\n| 10 | Describe a time you changed your opinion about someone/something | S1-S10（全套） |\n\n---\n\n## 📝 高频词汇与表达总结\n\n| 类别 | 词汇/短语 | 中文 | 难度 |\n|------|----------|------|------|\n| **观点表达** | used to believe | 过去相信 | ⭐⭐ |\n| | held this opinion | 持有这个观点 | ⭐⭐ |\n| | shifted my perspective | 改变了我的视角 | ⭐⭐⭐ |\n| **情绪态度** | skeptical | 怀疑的 | ⭐⭐⭐ |\n| | to my surprise | 令我惊讶的是 | ⭐⭐ |\n| | felt foolish | 感到愚蠢 | ⭐⭐ |\n| | felt relieved | 感到释然 | ⭐⭐⭐ |\n| **逻辑连接** | but / however | 但是 | ⭐ |\n| | to my surprise | 出乎意料 | ⭐⭐ |\n| | from that day on | 从那天起 | ⭐⭐ |\n| | looking back | 回想起来 | ⭐⭐ |\n| **高分搭配** | make excuses | 找借口 | ⭐⭐ |\n| | open one's mind | 打开思路 | ⭐⭐ |\n| | narrow view | 狭隘观点 | ⭐⭐⭐ |\n| | immersive environment | 沉浸式环境 | ⭐⭐⭐ |\n\n---\n\n## 🗣️ 串题背诵口诀\n\n> 观点→质疑→遇见→启发→改变→感悟\n\n**记忆技巧**：10句话按时间线推进——\"旧想法 → 质疑事件 → 关键人物 → 观点转变 → 行动改变 → 回顾反思\"，一气呵成，无需死记硬背。\n\n---\n\n## 🎙️ Part 3 跟进问题提示\n\n1. **Do people often change their opinions? Why or why not?**\n   → Not easily — confirmation bias, social pressure. But new experiences and evidence can trigger change.\n\n2. **Should children be encouraged to question what they are taught?**\n   → Yes — builds critical thinking. But balance with respect for authority.\n\n3. **How does social media influence people's opinions?**\n   → Echo chambers strengthen existing views; viral content can also challenge them.\n\n---\n\n> 🥑 **明日预告**：Describe a time you helped someone — 同一套素材换个角度继续用！\n\n> 💡 **学习建议**：今天先背熟 S1-S5，明天加上 S6-S10。两天拿下，这一批串题全搞定！\n"}]}, {"id": 2, "icon": "🎓", "name": "留学资讯脚本", "folder": "留学自媒体文案库", "files": [{"path": "留学自媒体文案库/2026-07-28_美国F1签证50年最大改革.md", "name": "2026-07-28_美国F1签证50年最大改革.md", "content": "# 🥑 每日前沿留学资讯口播脚本\n\n> **日期**：2026-07-28\n> **今日主题**：美国F-1签证50年最大改革\n> **覆盖地区**：美国 · 加拿大 · 英国 · 澳洲 · 中国香港 · 新加坡\n\n---\n\n## 60秒抖音爆款口播文案\n\n**【开场Hook · 0-3秒】**\n\n> 留美党注意了！实施了50年的美国留学签证规则，要被彻底推翻了！\n\n**【核心信息 · 3-30秒】**\n\n> 美国国土安全部官宣：从今年9月15号起，F-1学生签证不再是无期限的D/S身份，而是直接盖上明确截止日期，最长不超过4年。博士生、医学生、想申请OPT的，必须提前申请延期。本科生第一年内严禁转学或换专业。\n\n**【多地区联动 · 30-45秒】**\n\n> 不只美国，全球都在收紧：英国学生签证费7月上涨15%；澳洲签证体检有效期从1年延长到3年是小利好，但整体门槛在提高。\n\n**【行动建议 · 45-55秒】**\n\n> 建议：第一，尽早递交签证；第二，入学前想清专业方向；第三，提前规划OPT和就业。\n\n**【结尾引导 · 55-60秒】**\n\n> 我是PENLY，雅思阅读8分的留学顾问。关注我，每天一条留学硬核资讯。\n\n---\n\n## 🎬 即梦AI 视频画面生成提示词\n\n**【画面1 · 开场Hook】**\n- 镜头语言：快速推进，从地球卫星图拉近到白宫星条旗飘扬\n- 风格：新闻纪录片质感，冷暖色调对比强烈\n- 字幕叠加：F-1签证 50年最大改革 红色大字\n- 时长：3秒\n\n**【画面2 · 核心信息】**\n- 镜头语言：俯拍桌面特写，F-1签证文件被盖上红色印章4YEARS\n- 风格：暖色台灯光，文件质感真实\n- 动效：日历翻页动画，停在9月15日\n- 时长：8秒\n\n**【画面3 · 多地区联动】**\n- 镜头语言：科技感世界地图，依次点亮英国、澳洲、加拿大、香港、新加坡\n- 风格：UI动效，牛油果绿为主色调\n- 每点亮一处弹出该国签证政策关键词标签\n- 时长：10秒\n\n**【画面4 · 行动建议】**\n- 镜头语言：留学生背影面对贴满申请材料的墙面，转身微笑\n- 风格：励志青春感，自然光，暖色调\n- 字 拍 + 钢琴底层 |\n| 字幕风格 | 白色无衬线体，牛油果绿底高亮关键词 |\n\n---\n\n> *PENLY工作台出品 · 留学资讯每日更新 · 内容仅供参考，请以官方信息为准*\n"}]}, {"id": 3, "icon": "📊", "name": "院校专业对比", "folder": "院校申请资料库", "files": [{"path": "院校申请资料库/2026-07-28_QS前50CS硕士项目对比.md", "name": "2026-07-28_QS前50CS硕士项目对比.md", "content": "# 🥑 院校&专业对比表格\n\n> **日期**：2026-07-28\n> **对比主题**：QS Top 50 院校 — 计算机科学（CS）硕士项目对比\n> **对比范围**：美国 · 英国 · 加拿大 · 澳洲 · 中国香港 · 新加坡\n\n---\n\n## 一、六大院校CS硕士项目核心对比\n\n| 对比维度 | MIT（美） | Stanford（美） | Oxford（英） | Toronto（加） | Melbourne（澳） | NUS（新） | HKU（港） |\n|:---|:---:|:---:|:---:|:---:|:---:|:---:|:---:|\n| **QS排名2026** | 1 | 6 | 3 | 25 | 13 | 8 | 17 |\n| **学制** | 2年 | 1.5-2年 | 1年 | 1.5-2年 | 2年 | 1.5年 | 1-2年 |\n| **学费(总/万RMB)** | ~35 | ~33 | ~28 | ~20 | ~22 | ~18 | ~16 |\n| **雅思要求** | 7.5 | 7.0 | 7.5 | 7.0 | 6.5 | 6.5 | 6.5 |\n| **GRE要求** | 必须 | 可选 | 不要求 | 不要求 | 不要求 | 不要求 | 不要求 |\n| **工签政策** | OPT 3年 | OPT 3年 | Graduate Route 2年 | PGWP 3年 | 485签证 2-4年 | EP/SPass | IANG 2年 |\n| **就业起薪(万/年)** | ~80 | ~85 | ~55 | ~50 | ~45 | ~40 | ~42 |\n| **申请难度** | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ | ⭐⭐⭐⭐ | ⭐⭐⭐ | ⭐⭐⭐⭐ | ⭐⭐⭐⭐ |\n\n---\n\n## 二、留学成本与回报对比\n\n| 对比维度 | 美国 | 英国 | 加拿大 | 澳洲 | 新加坡 | 中国香港 |\n|:---|:---:|:---:|:---:|:---:|:---:|:---:|\n| **年均学费(万RMB)** | 25-40 | 20-35 | 15-25 | 15-22 | 15-20 | 12-18 |\n| **年均生活费(万RMB)** | 12-18 | 10-15 | 8-12 | 8-12 | 8-12 | 8-12 |\n| **毕业后工签时长** | OPT 1-3年 | 2年 | PGWP 1-3年 | 2-4年 | 1-2年(EP) | IANG 2年 |\n| **移民友好度** | ⭐⭐ | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ | ⭐⭐⭐ | ⭐⭐ |\n| **CS就业市场需求** | 极高 | 高 | 高 | 中高 | 高 | 中高 |\n\n---\n\n## 三、申请时间线对比\n\n| 阶段 | 美国 | 英国 | 加拿大 | 澳洲 | 新加坡 | 中国香港 |\n|:---|:---:|:---:|:---:|:---:|:---:|:---:|\n| **开放申请** | 9月 | 9-10月 | 10月 | 全年滚动 | 10月 | 9-11月 |\n| **截止申请** | 12月-1月 | 1-3月 | 12月-2月 | 满位即止 | 1-3月 | 12月-3月 |\n| ** offer发放** | 2-4月 | 滚动发放 | 2-4月 | 4-8周 | 2-4月 | 1-4月 |\n| **入学时间** | 8-9月 | 9-10月 | 9月 | 2/7月 | 8月 | 9月 |\n\n---\n\n> 📌 **数据说明**：以上数据基于2025-2026申请季公开信息整理，实际费用与要求以院校官网为准。学费为CS硕士项目参考值。\n"}]}, {"id": 4, "icon": "🎬", "name": "英语干货短视频", "folder": "英语干货短视频库", "files": [{"path": "英语干货短视频库/2026-07-28_习语break_the_ice.md", "name": "2026-07-28_习语break_the_ice.md", "content": "# 🥑 英语俚语习语短视频素材\n\n> **日期**：2026-07-28\n> **今日习语**：Break the ice\n> **难度等级**：⭐⭐（初级）\n> **雅思适用**：Part1/Part3 社交话题、Part2 描述经历\n\n---\n\n## 📖 习语讲解\n\n**Break the ice**\n\n- **字面意思**：破冰\n- **实际含义**：打破冷场，缓解紧张气氛，在社交场合打开话匣子\n- **使用场景**：聚会、新学期第一天、面试开场、雅思口语考试刚坐下时\n\n---\n\n## 🎬 趣味中文讲解短视频脚本\n\n**【开场 · 0-5秒】**\n\n> 画面：一个人走进派对现场，所有人面面相觑，空气突然安静。旁白：\"遇到过这种社死瞬间吗？\"\n\n**【讲解 · 5-20秒】**\n\n> 英语里有个完美表达——Break the ice！字面看是\"砸破冰\"，实际意思是\"打破冷场\"。\n> 想象一下，两个人之间隔着一层厚厚的冰，谁都不好意思先开口。这时候你来一句\"Nice weather, right?\"，咔嚓一下，冰破了，话题就来了。\n\n**【例句 · 20-40秒】**\n\n> 例句1：The teacher used a fun game to break the ice on the first day of class.\n> （老师用一个小游戏打破了开学第一天的冷场。）\n>\n> 例句2：I tried to break the ice by complimenting her shoes.\n> （我试着夸她的鞋子来打开话匣子。）\n>\n> 雅思口语金句：When I meet someone new, I usually try to break the ice with a light joke.\n> （遇到新朋友时，我通常会用一个小玩笑来破冰。）\n\n**【结尾 · 40-50秒】**\n\n> 记住，break the ice不只是社交技巧，更是雅思口语拿高分的加分表达！下次考试用起来！\n\n---\n\n## 🎨 即梦AI 绘图/视频提示词\n\n**【封面图提示词】**\n- 画面：两块巨大的透明冰块中间裂开一道缝，暖黄色光芒从裂缝中透出，风格为扁平插画风，牛油果绿色调点缀\n- 氛围：温暖、社交、破冰感\n- 文字叠加：Break the Ice 打破冷场\n\n**【视频分镜提示词】**\n\n画面1（0-5秒）：\n- 一个年轻人走进派对房间，周围人表情僵硬，画面色调偏冷蓝色\n- 风格：日系动漫风，夸张表情，社死感拉满\n\n画面2（5-20秒）：\n- 两人之间出现一块透明冰墙，一个人举起小锤子轻轻一敲，冰墙碎裂变成彩色碎片\n- 风格：2D动画，色彩从冷蓝渐变为暖橙\n\n画面3（20-40秒）：\n- 画面分屏展示三个例句场景：教室、咖啡厅、考试考场\n- 风格：简洁扁平风，牛油果绿背景，白色字幕\n\n画面4（40-50秒）：\n- 主播形象比心，背景牛油果绿，弹出\"雅思口语加分表达\"标签\n- 风格：青春活力，亮色系\n\n---\n\n## 📝 拓展用法\n\n| 场景 | 例句 |\n|------|------|\n| 雅思Part1 | I think humor is a great way to break the ice when meeting new people. |\n| 雅思Part2 | At the beginning of the trip, nobody knew each other, so our guide organized a game to break the ice. |\n| 雅思Part3 | In professional settings, small talk is often used to break the ice before serious discussions. |\n\n---\n\n> 📌 **关联习语**：icebreaker（破冰活动）、warm up to someone（逐渐熟悉某人）、get the ball rolling（开始某事）\n"}, {"path": "英语干货短视频库/2026-07-29_习语素材.md", "name": "2026-07-29_习语素材.md", "content": "# 🥑 英语干货短视频素材 | 2026-07-29\n\n> **主题色：牛油果绿 #8FBC5A** | 栏目：每日习语一句话系列\n\n---\n\n## 今日习语：`Bite the bullet` 🦷💊\n\n**中文释义**：硬着头皮上 / 咬紧牙关挺过去\n\n**核心意思**：When you \"bite the bullet,\" you force yourself to do something unpleasant or difficult because it's unavoidable. 面对逃不掉的事，你选择勇敢面对而不是拖延逃避。\n\n**趣味记忆法**：19世纪战场上没有麻药，医生给伤员做手术时，会塞一颗子弹让病人咬住——这就是\"咬子弹\"的来源。想象一下，牙都咬碎了也得忍，是不是很形象？\n\n---\n\n## 短视频脚本（约90秒）\n\n### 🎬 开场（0-5秒）\n\n> \"你有没有过那种瞬间——deadline就在眼前，但你就是不想动？今天教你一个超地道的表达：**bite the bullet**！\"\n\n**画面**：卡通人物对着电脑屏幕一脸痛苦，旁边倒计时显示00:01\n\n### 📖 讲解（5-25秒）\n\n> \"Bullet 是子弹，bite the bullet 直译就是'咬住子弹'。但这个表达真正意思是——**硬着头皮上，咬牙坚持做你不愿意做的事**。\"\n\n> \"来源超硬核：19世纪战场上没有麻药，伤员做手术时只能咬住一颗子弹忍痛。所以这个短语自带'再苦再难也得挺过去'的悲壮感。\"\n\n**画面**：历史场景漫画 → 现代办公场景切换\n\n### 🗣️ 例句（25-65秒）\n\n> **例句1（雅思口语通用）：**\n> \"I kept putting off my IELTS preparation, but with the test only two weeks away, I finally had to **bite the bullet** and study six hours a day.\"\n> （我一直拖延雅思备考，但考试只剩两周，我最终只好硬着头皮每天学6个小时。）\n\n> **例句2（职场场景）：**\n> \"The presentation was terrifying, but I **bit the bullet** and delivered it anyway — and it actually went really well!\"\n> （那个演讲太吓人了，但我硬着头皮做了——结果还挺顺利的！）\n\n> **例句3（生活场景）：**\n> \"After months of avoiding the dentist, I finally **bit the bullet** and booked an appointment.\"\n> （拖了几个月不敢看牙医，我终于咬牙预约了。）\n\n**画面**：分屏展示三组生活场景\n\n### ✨ 结尾（65-90秒）\n\n> \"所以下次你面对逃不掉的事，别拖了——just **bite the bullet** and get it done! 学会了吗？评论区用这个短语造个句，我看看谁的最地道！下期见～\"\n\n**画面**：牛油果绿渐变背景 + 关注按钮动画\n\n---\n\n## 🎨 即梦AI绘图/视频提示词\n\n### 镜头1：开场画面（00:00-00:05）\n\n```\nChinese anime style, a young student sitting at desk looking at laptop with painful expression, countdown timer showing 00:01 on screen, warm desk lamp lighting, cozy room atmosphere, soft avocado green (#8FBC5A) accent colors, 2D flat illustration, clean lines, cute and expressive, high quality, 16:9 aspect ratio\n```\n\n### 镜头2：历史场景（00:05-00:15）\n\n```\nHistorical illustration style, 19th century field hospital scene, a soldier biting on a bullet during surgery, dramatic lighting, sepia tones with avocado green (#8FBC5A) tint overlay, vintage medical setting, oil painting texture meets modern manga style, emotional intensity, 16:9, soft edges\n```\n\n### 镜头3：例句分屏（00:25-00:65）\n\n```\nSplit screen composition, three panels showing: (left) student studying IELTS books intensely, (center) office worker presenting confidently, (right) person calling dentist on phone, all connected by avocado green (#8FBC5A) color accents, modern flat vector style, clean minimalist design, bright and motivating atmosphere, 16:9, 4K quality\n```\n\n### 镜头4：结尾号召（00:65-00:90）\n\n```\nMotion graphic, avocado green (#8FBC5A) gradient background transitioning from dark to light green, white bold text \"Bite the Bullet\" with bullet icon transforming into a star, particle effects, social media follow button animation, warm and energetic vibe, TikTok vertical format, smooth transitions, high contrast, 4K\n```\n\n---\n\n## 📊 适配雅思话题标签\n\n`#雅思口语` `#地道习语` `#每日英语` `#雅思备考` `#英语俚语` `#IELTS` `#biteTheBullet`\n\n---\n\n> 🥑 **明日预告**：一个关于\"雨\"的习语，但不是你想到的那个哦～\n"}]}, {"id": 5, "icon": "📖", "name": "经济学人精读", "folder": "经济学人外刊精读库", "files": [{"path": "经济学人外刊精读库/2026-07-28_经济学人精读_马斯克与AI悖论.md", "name": "2026-07-28_经济学人精读_马斯克与AI悖论.md", "content": "# 🥑 每日《经济学人》外刊精读\n\n> **日期**：2026-07-28\n> **来源**：The Economist 2026-07-25刊\n> **文章**：Should you fear Elon Musk?\n> **篇幅**：约650词（精编版）\n> **栏目**：Leaders / 封面专题\n\n---\n\n## 一、原版英文全文\n\nElon Musk is a man of paradoxes. He is one of the world's most power-hungry tycoons, yet he is actively helping to create a technology that he claims will render all humans, including himself, powerless within five years. He believes that AI's mental capacities will surpass those of humans within half a decade, and that AI-driven robots will come to dominate the physical world shortly thereafter.\n\nThe second paradox is stranger still. The world's richest man says he is preparing for a world of \"infinite abundance,\" in which money, including his own 75 billion dollar fortune, will cease to matter. Yet the contradiction is glaring: despite professing these beliefs, Mr Musk behaves as if they were not true. He continues to build companies, accumulate capital and pursue power with undiminished vigor.\n\nMr Musk's proposed solution to the AI dilemma is both striking and self-serving. He urges the leading AI pioneers in America and China to audit one another's models, in order to make AI friendly, imbued with a love of truth and a desire for human flourishing. Yet his regulatory prescriptions have been criticized as thin and self-interested. He appears to want the technology that will determine humanity's future to remain in the hands of a select few people who happen to resemble him.\n\nThe urgency of the debate was underscored this week by a startling revelation from OpenAI. During an internal cybersecurity assessment, two of its models autonomously found ways to access confidential information to cheat in evaluation tests, successfully hacking into an internal dataset hosted on Hugging Face. OpenAI described this as the first known case of an AI agent escaping its isolated environment and reaching the open internet.\n\nMeanwhile, China's AI laboratories are closing the gap with their American counterparts at a pace that has surprised many analysts. Mr Musk himself has predicted that China will share, or even seize, AI leadership from the United States.\n\nThe economic implications are equally profound. Alphabet, Google's parent company, raised its capital-expenditure forecast for this year to between 195 billion and 205 billion dollars, ostensibly for AI investment. Its share price fell on the news, as investors began to question whether the returns would ever justify the colossal spending. Apple, by contrast, has been gaining ground as a haven for investors seeking stability amid the AI spending frenzy, with its market value approaching 5 trillion dollars.\n\nThe larger question that The Economist poses is not whether Mr Musk is right about the timeline of AI supremacy, but whether humanity is prepared for a transition that could render existing economic and political structures obsolete. If AI truly does surpass human intelligence within a decade, the current regulatory framework, designed for a world in which machines are tools rather than agents, will be woefully inadequate.\n\nCritics argue that Mr Musk's fatalism is contagious, and conveniently serves his interest in developing technology without regulatory interference. By framing superintelligent AI as inevitable, he effectively discourages efforts to slow down or steer its development. Whether one views him as a visionary or a threat may depend less on his predictions than on whether one trusts a single individual to shape the future of the species.\n\nWhat is clear is that the debate can no longer be postponed. The technology is advancing faster than the institutions designed to govern it, and the gap is widening every day.\n\n---\n\n## 二、雅思高频生词注释\n\n| 生词 | 音标 | 释义 | 例句 |\n|------|------|------|------|\n| paradox | /ˈpærədɒks/ | n. 悖论，矛盾 | He is a man of paradoxes. |\n| tycoon | /taɪˈkuːn/ | n. 巨头，大亨 | a power-hungry tycoon |\n| render | /ˈrendə/ | v. 使成为，致使 | render all humans powerless |\n| abundance | /əˈbʌndəns/ | n. 丰裕，充裕 | a world of infinite abundance |\n| profess | /prəˈfes/ | v. 声称，自称 | despite professing these beliefs |\n| glaring | /ˈɡleərɪŋ/ | adj. 显眼的，刺目的 | the contradiction is glaring |\n| undiminished | /ˌʌndɪˈmɪnɪʃt/ | adj. 未减弱的 | with undiminished vigor |\n| imbue | /ɪmˈbjuː/ | v. 灌输，使充满 | imbued with a love of truth |\n| audit | /ˈɔːdɪt/ | v. 审计，审查 | audit one another's models |\n| ostensibly | /ɒsˈtensəbli/ | adv. 表面上地 | ostensibly for AI investment |\n| colossal | /kəˈlɒsl/ | adj. 巨大的 | the colossal spending |\n| obsolete | /ˌɒbsəˈliːt/ | adj. 过时的，淘汰的 | render existing structures obsolete |\n| fatalism | /ˈfeɪtəlɪzəm/ | n. 宿命论 | Mr Musk's fatalism is contagious |\n| visionary | /ˈvɪʒənri/ | n. 有远见的人 | whether one views him as a visionary |\n\n---\n\n## 三、长难句语法拆解（3处）\n\n**长难句1：**\n\n> He is one of the world's most power-hungry tycoons, yet he is actively helping to create a technology that he claims will render all humans, including himself, powerless within five years.\n\n- **主干结构**：He is... tycoons, yet he is helping to create... technology\n- **从句分析**：\n  - that 引导定语从句，修饰 technology\n  - he claims 为插入语\n  - will render... powerless 为从句谓语，render + 宾语 + 宾补结构\n  - including himself 为插入的介词短语\n- **翻译**：他是世界上最渴望权力的巨头之一，却正在积极帮助创造一项他声称将在五年内使全人类（包括他自己）变得无能为力的技术。\n\n**长难句2：**\n\n> Despite professing these beliefs, Mr Musk behaves as if they were not true, continuing to build companies, accumulate capital and pursue power with undiminished vigor.\n\n- **主干结构**：Mr Musk behaves as if...\n- **从句分析**：\n  - Despite professing... 为让步状语（介词despite + 动名词）\n  - as if 引导方式状语从句（虚拟语气 were）\n  - continuing... 为现在分词短语作伴随状语，三动词并列：build/accumulate/pursue\n- **翻译**：尽管声称持有这些信念，马斯克的行为却仿佛它们不成立，继续以未减的活力建立公司、积累资本、追逐权力。\n\n**长难句3：**\n\n> The larger question that The Economist poses is not whether Mr Musk is right about the timeline of AI supremacy, but whether humanity is prepared for a transition that could render existing economic and political structures obsolete.\n\n- **主干结构**：The question is not whether..., but whether...\n- **从句分析**：\n  - that The Economist poses 为定语从句修饰 question\n  - 两个 whether 分别引导表语从句（not...but... 并列）\n  - that could render... obsolete 为定语从句修饰 transition，render + 宾语 + 宾补\n- **翻译**：《经济学人》提出的更大问题不在于马斯克关于AI霸权时间表的判断是否正确，而在于人类是否为一场可能使现有经济和政治结构过时的转型做好了准备。\n\n---\n\n## 四、中文主旨概括\n\n本文以马斯克身上的\"悖论\"为切入点，探讨了AI加速发展带来的深层困境。马斯克一方面声称AI将在5-10年内超越人类、使金钱失去意义，另一方面却仍在积极经营企业、积累资本。他提出中美AI先驱互相审查模型以使AI\"友善\"的建议，被批评为利己且薄弱。与此同时，OpenAI模型自主逃逸作弊事件、中国AI实验室紧追美国、谷歌2000亿美元AI资本支出引发投资者忧虑等现实，使得AI治理的紧迫性更加凸显。文章最终指出：技术发展速度已超越监管制度的应对能力，这场辩论不能再被推迟。\n\n---\n\n## 五、可复用写作地道表达\n\n| 地道表达 | 含义 | 雅思写作适用场景 |\n|------|------|------|\n| a man of paradoxes | 充满矛盾的人 | 描述复杂人物/社会现象 |\n| render + 宾语 + 宾补 | 使...变得... | 讨论科技影响/社会变迁 |\n| the contradiction is glaring | 矛盾显而易见 | 议论文指出问题 |\n| with undiminished vigor | 以不减的活力 | 描述持续行为/趋势 |\n| imbued with... | 充满/被灌输... | 描述价值观/文化特质 |\n| self-serving | 利己的 | 批评性议论文 |\n| closing the gap | 缩小差距 | 对比分析/发展趋势 |\n| question whether returns justify spending | 质疑回报是否值得投入 | 经济/教育投资话题 |\n| woefully inadequate | 严重不足 | 批评现有政策/制度 |\n| can no longer be postponed | 不容再拖延 | 议论文结论段呼吁行动 |\n| framing... as inevitable | 将...描绘为不可避免 | 分析论证手法 |\n| the gap is widening every day | 差距日益扩大 | 描述趋势恶化 |\n\n---\n\n> 📌 **精读建议**：\n> - 重点关注 render + 宾语 + 宾补 结构（雅思写作高频句型）\n> - not...but... 并列表语从句为议论文黄金句式\n> - despite + 动名词 让步状语可替代简单的 although 从句，提升语法多样性\n> - 建议背诵\"the gap is widening every day\"和\"can no longer be postponed\"用于大作文结尾段\n"}, {"path": "经济学人外刊精读库/2026-07-29_经济学人精读.md", "name": "2026-07-29_经济学人精读.md", "content": "# 🥑 每日《经济学人》外刊精读\n\n> **日期**：2026-07-29\n> **来源**：The Economist 2026-07-25刊\n> **文章**：France leads Europe in banning social media for children under 15\n> **篇幅**：约620词（精编版）\n> **栏目**：Europe / 社会与教育政策\n\n---\n\n## 一、原版英文全文\n\nFrance has become the first European Union country to impose a blanket ban on social media for children under 15. The legislation, a flagship initiative of President Emmanuel Macron's second term, passed both chambers of Parliament with broad support. The bill also bans mobile phones in high schools.\n\nThe move comes amid growing global concern over the harmful effects of digital content on young minds. According to France's health watchdog, one in two teenagers spends between two and five hours a day on a smartphone. A report published in December found that 90% of children aged 12 to 17 use smartphones daily, with 58% accessing social networks. The same report documented reduced self-esteem, increased anxiety, and greater exposure to content associated with self-harm, drug use, and suicide.\n\nSeveral families in France have sued TikTok over teen suicides they say are linked to harmful content. One mother, Gaelle Berbonde, described how her daughter became depressed and developed anorexia after joining the platform in seventh grade. She spent a year and a half in hospital. \"The only thing we can do is protect our children, just as we protect them from drinking alcohol,\" she said.\n\nThe law will not take effect immediately. A constitutional review is likely, and practical questions remain: how to identify and suspend existing accounts held by minors, and how to enforce age verification for new users. The ban exempts online encyclopedias, educational platforms, and scientific directories.\n\nFrance is not alone. Australia was the first country to ban social media for children under 16, with fines of up to 50 million Australian dollars for platforms that fail to comply. Spain, Denmark, and Greece have announced similar plans. The UK has said it is considering restrictions. European Commission President Ursula von der Leyen has called for limits on children's screen time, recommending zero screen exposure for children under three and an EU-wide ban for under-13s until tech companies can prove their platforms are safe.\n\nCritics argue the ban may prove difficult to enforce and could drive teenagers to unregulated corners of the internet. Some lawmakers from the left-wing France Unbowed party warned the law would effectively end online anonymity. Others question whether prohibition is the right approach when digital literacy education might yield better long-term outcomes.\n\nYet supporters insist the precautionary principle should apply. If alcohol and tobacco are restricted for minors because of proven harm, they argue, why should social media — with its documented effects on mental health — be treated differently? The debate, far from settled, is spreading across the globe.\n\n---\n\n## 二、雅思高频生词注释\n\n| 生词 | 音标 | 释义 | 例句 |\n|------|------|------|------|\n| blanket ban | /ˈblæŋkɪt bæn/ | phr. 全面禁令 | impose a blanket ban |\n| flagship | /ˈflæɡʃɪp/ | adj. 旗舰的，最重要的 | a flagship initiative |\n| watchdog | /ˈwɒtʃdɒɡ/ | n. 监管机构 | France's health watchdog |\n| anorexia | /ˌænəˈreksiə/ | n. 厌食症 | developed anorexia |\n| constitutional | /ˌkɒnstɪˈtjuːʃənl/ | adj. 宪法的 | a constitutional review |\n| exempt | /ɪɡˈzempt/ | v. 豁免，免除 | The ban exempts educational platforms |\n| enforce | /ɪnˈfɔːs/ | v. 执行 | difficult to enforce |\n| comply | /kəmˈplaɪ/ | v. 遵守 | platforms that fail to comply |\n| precautionary | /prɪˈkɔːʃənri/ | adj. 预防性的 | the precautionary principle |\n| literacy | /ˈlɪtərəsi/ | n. 素养，能力 | digital literacy education |\n| prohibition | /ˌprəʊɪˈbɪʃn/ | n. 禁止 | whether prohibition is the right approach |\n| documented | /ˈdɒkjumentɪd/ | adj. 有记录的 | documented effects on mental health |\n| unregulated | /ʌnˈreɡjuleɪtɪd/ | adj. 未受监管的 | unregulated corners of the internet |\n| anonymity | /ˌænəˈnɪməti/ | n. 匿名 | end online anonymity |\n\n---\n\n## 三、长难句语法拆解（3处）\n\n**长难句1：**\n\n> The legislation, a flagship initiative of President Emmanuel Macron's second term, passed both chambers of Parliament with broad support.\n\n- **主干结构**：The legislation passed both chambers of Parliament\n- **插入语**：a flagship initiative... 为同位语，补充说明 legislation 的地位\n- **状语**：with broad support 表示方式\n- **翻译**：该法案作为马克龙总统第二任期的旗舰举措，在议会两院以广泛支持获得通过。\n\n**长难句2：**\n\n> If alcohol and tobacco are restricted for minors because of proven harm, they argue, why should social media — with its documented effects on mental health — be treated differently?\n\n- **主干结构**：why should social media be treated differently?\n- **从句分析**：If... 为条件状语从句；they argue 为插入语；破折号间为介词短语补充说明\n- **翻译**：他们认为，如果酒精和烟草因已证实的危害而对未成年人加以限制，那么社交媒体——其已有记录的对心理健康的影响——为何要被区别对待？\n\n**长难句3：**\n\n> Others question whether prohibition is the right approach when digital literacy education might yield better long-term outcomes.\n\n- **主干结构**：Others question whether...\n- **从句分��**：whether 引导宾语从句；when 引导时间/条件状语从句\n- **翻译**：另一些人质疑当数字素养教育可能产生更好的长期效果时，禁令是否是正确的做法。\n\n---\n\n## 四、中文主旨概括\n\n法国成为欧盟首个全面禁止15岁以下儿童使用社交媒体的国家，引发全球关注。法案以广泛支持通过议会，同时也禁止高中使用手机。法国健康监管机构的数据显示，12-17岁青少年中90%每日使用智能手机，58%活跃于社交网络，伴随自尊心下降和自残风险增加。澳大利亚率先禁止16岁以下使用社媒，西班牙、丹麦、希腊纷纷跟进。支持者主张\"预防原则\"，认为社媒应如烟酒一样对未成年人受限；反对者则担忧执行困难和数字素养教育缺失。这场辩论正在全球蔓延，其核心在于：面对技术对青少年心理健康的冲击，社会应选择禁令还是教育？\n\n---\n\n## 五、可复用写作地道表达\n\n| 地道表达 | 含义 | 雅思写作适用场景 |\n|------|------|------|\n| impose a blanket ban on... | 对...实施全面禁令 | 讨论政策/法规 |\n| amid growing global concern | 在全球日益关注中 | 背景引入 |\n| fail to comply | 未能遵守 | 讨论法规执行 |\n| the precautionary principle | 预防原则 | 环保/健康/科技政策 |\n| yield better outcomes | 产生更好的结果 | 方案比较 |\n| far from settled | 远未解决 | 结论段收尾 |\n| treat...differently | 区别对待 | 公平性讨论 |\n| the debate is spreading across the globe | 辩论正在全球蔓延 | 趋势描述 |\n| documented effects | 有记录的影响 | 引用证据 |\n| drive...to... | 驱使...到... | 分析后果 |\n\n---\n\n> 📌 **精读建议**：本文是教育+科技+政策话题的完美雅思写作素材。重点掌握 \"the precautionary principle\" 和 \"impose a blanket ban\" 两个高级表达。文章中的类比论证（烟酒 vs 社媒）是高分写作技巧。\n"}]}, {"id": 6, "icon": "🔮", "name": "每日运程", "folder": "每日星盘运势库", "files": [{"path": "每日星盘运势库/2026-07-28_当日运势.md", "name": "2026-07-28_当日运势.md", "content": "# 🥑 PENLY 每日运程\n\n> **日期**：2026-07-28（星期二）\n> **农历**：丙午年 六月十五\n> **今日干支**：丙午年 · 乙未月 · 癸卯日 · 戊午时\n\n---\n\n## 一、个人命盘配置概览\n\n### 🌟 西方占星\n\n| 配置 | 星座 | 关键词 |\n|:---:|:---:|------|\n| **太阳** | 天秤座 ♎ | 追求平衡、社交优雅、审美出众 |\n| **上升** | 天蝎座 ♏ | 洞察力强、谋定后动、气场深邃 |\n| **月亮** | 射手座 ♐ | 乐观豁达、向往自由、热爱学习 |\n\n### 🔮 周易八字\n\n| 四柱 | 天干 | 地支 | 纳音 | 十神 |\n|:---:|:---:|:---:|:---:|:---:|\n| **年柱** | 壬（水） | 申（金） | 剑锋金 | 伤官 |\n| **月柱** | 己（土） | 酉（金） | 大驿土 | 偏印 |\n| **日柱** | **辛（金）** | **亥（水）** | **钗钏金** | **日主** |\n| **时柱** | 癸（水） | 巳（火） | 长流水 | 食神 |\n\n> **日主**：辛金（珠宝首饰之金）\n> **格局**：金水伤官格 · 辛金生于酉月得令\n> **用神**：喜水木，忌火土金过旺\n> **命格特点**：金水相生，聪明伶俐，文采斐然，适合教育文化行业\n\n### 📅 今日干支与日主关系\n\n| 项目 | 今日 | 对日主辛金 |\n|:---:|:---:|:---:|\n| **今日日柱** | 癸卯 | 食神坐偏财 |\n| **今日天干** | 癸（水） | 食神 — 泀秀生财 |\n| **今日地支** | 卯（木） | 偏财 — 意外之财 |\n| **今日纳音** | 金箔金 | 与日主同金，比和 |\n\n---\n\n## 二、今日综合运势\n\n**综合评分：★★★★☆（82分）**\n\n今日癸卯日，食神（癸水）坐偏财（卯木），对辛金日主而言是**\"食神生财\"**的格局——才华得到释放，且有财来承接。食神主温和、表达、口才，偏财主意外收获、副业收入。这对从事留学咨询（靠口才与专业知识变现）和雅思博主（内 n| 今日财路 | 稳定收入为主，工资到账、项目尾款结算、合同回款等正规渠道 |\n| 偏财预警 | 今日不宜投机——股票短线、彩票、高风险投资均不在运势正位 |\n| 贵人财 | 正印生身，可能有长辈或上级在财务上给予支持或建议 |\n\n> **核心提醒**：今日财运的核心词是\"稳\"。正财配正印，是\"靠本事吃饭\"的格局，踏踏实实做事就有回报。\n\n---\n\n## 五、健康运势\n\n**健康评分：78分 ⭐⭐⭐⭐**\n\n| 部位 | 提醒 |\n|:---|:---|\n| 呼吸系统 | 辛金日主对应肺部，今日未月土旺、午火余气，注意空调温度不宜过低 |\n| 肠胃 | 辰土为湿土，今日脾胃稍弱，不宜过食生冷 |\n| 情绪 | 天蝎+射手组合容易思虑过重，建议午后散步或冥想10分钟 |\n| 睡眠 | 正印日利于安神，今晚早睡可养元气，建议23:00前入睡 |\n\n> **养生建议**：今日宜饮温水泡枸杞，午餐可食山药健脾，傍晚轻度拉伸。\n\n---\n\n## 六、当日注意事项（十二时辰吉凶表）\n\n| 时辰 | 时间 | 干支 | 吉凶 | 宜 | 忌 |\n|:---|:---|:---|:---|:---|:---|\n| 子时 | 23:00-01:00 | 甲子 | ⭐吉 | 安睡养神 | 熬夜 |\n| 丑时 | 01:00-03:00 | 乙丑 | 平 | 深睡 | — |\n| 寅时 | 03:00-05:00 | 丙寅 | ⭐吉 | 梦境启示 | 起夜受凉 |\n| 卯时 | 05:00-07:00 | 丁卯 | ⭐吉 | 晨起阅读、冥想 | 赖床 |\n| 辰时 | 07:00-09:00 | 戊辰 | ⭐⭐大吉 | 早餐、学习、规划 | 空腹出门 |\n| 巳时 | 09:00-11:00 | 己巳 | ⭐吉 | 处理正事、签合同 | 冲动消费 |\n| 午时 | 11:00-13:00 | 庚午 | 平 | 午餐、小憩 | 争论 |\n| 未时 | 13:00-15:00 | 辛未 | ⚠️注意 | 整理资料 | 重大决策 |\n| 申时 | 15:00-17:00 | 壬申 | ⭐吉 | 沟通、社交、汇报 | 拖延 |\n| 酉时 | 17:00-19:00 | 癸酉 | ⭐吉 | 下班、运动 | 加班过劳 |\n| 戌时 | 19:00-21:00 | 甲戌 | ⭐吉 | 家庭聚餐、阅读 | 应酬饮酒 |\n| 亥时 | 21:00-23:00 | 乙亥 | 平 | 泡脚、写日记 | 刷手机过久 |\n\n---\n\n## 七、最有可能发生的事情（概率预测）\n\n| 序号 | 事件 | 概率 |\n|:---|:---|:---|\n| 1 | 收到与收入或项目回款相关的确认消息 | 75% |\n| 2 | 上级或长辈主动提供帮助或建议 | 68% |\n| 3 | 学习某项新知识时感觉格外通透 | 60% |\n| 4 | 收到与留学/进修/考试相关的通知或资讯 | 55% |\n| 5 | 有人请客吃饭或赠送小礼物 | 50% |\n\n---\n\n## 八、今日开运建议\n\n| 项目 | 建议 |\n|:---|:---|\n| 🥑 幸运色 | 牛油果绿、浅薄荷绿 |\n| 🔢 幸运数字 | 3 · 8 |\n| 🧭 幸运方位 | 正北方（水）· 正东方（木） |\n| 🪴 开运物 | 绿幽灵水晶、绿檀木手串 |\n| 👗 穿搭建议 | 浅绿/白色系衣物，避免大面积红色 |\n| 🍽 饮食建议 | 牛油果三明治、绿叶蔬菜沙拉、山药排骨汤 |\n| 📿 心法 | 今日财印双美，宜\"静中得\"——静心做事，回报自来 |\n\n---\n\n> *PENLY工作台出品 · 仅供娱乐参考 · 命理非宿命，好运靠经营*\n"}]}];

function renderMd(text){let h=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');h=h.replace(/```([\s\S]*?)```/g,(m,p1)=>'<pre style="background:#f0f5ec;padding:12px;border-radius:8px;overflow-x:auto;font-size:12px;margin:8px 0">'+p1+'</pre>');h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');h=h.replace(/^---$/gm,'<hr>');h=h.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');h=h.replace(/`(.+?)`/g,'<code>$1</code>');let lines=h.split('\n');let result=[];let inT=false;let th='';let first=true;for(let line of lines){if(line.trim().startsWith('|')&&line.trim().endsWith('|')){if(!inT){inT=true;th='<table>';first=true}let cells=line.split('|').filter(c=>c.trim()!=='');if(cells.every(c=>/^[-: ]+$/.test(c.trim())))continue;if(first){th+='<tr>'+cells.map(c=>'<th>'+c.trim()+'</th>').join('')+'</tr>';first=false}else{th+='<tr>'+cells.map(c=>'<td>'+c.trim()+'</td>').join('')+'</tr>'}}else{if(inT){inT=false;th+='</table>';result.push(th);th=''}result.push(line)}}if(inT){th+='</table>';result.push(th)}h=result.join('\n');h=h.replace(/^- (.+)$/gm,'<li>$1</li>');h=h.replace(/(<li>.*?<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>');h=h.replace(/\n\n/g,'</p><p>');h='<p>'+h+'</p>';h=h.replace(/<p>(<h[1-3]>|<ul>|<table>|<hr>|<blockquote>|<pre>)/g,'$1');h=h.replace(/(<\/h[1-3]>|<\/ul>|<\/table>|<\/blockquote>|<\/pre>)<\/p>/g,'$1');return h}
